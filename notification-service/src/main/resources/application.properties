spring.application.name=notification-service

# 8082: product-service owns 8080, order-service owns 8081
server.port=8082

management.endpoints.web.exposure.include=health,info

# Poison message handling (Faz 7.4). After 3 failed attempts (1 try + 2 retries), stop
# retrying instead of looping forever - this is what turns "one bad message jams the
# queue" into "one bad message reaches the DLQ and the queue keeps moving".
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
# Without this, an exhausted-retry message gets REQUEUED at the broker instead of
# dead-lettered - same infinite loop, just moved from the app to the broker.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
