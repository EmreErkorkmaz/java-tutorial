spring.application.name=product-service

# H2 in-memory DB - the dev-time equivalent of running a local throwaway database
# Postgres running in Docker - see compose.yaml
spring.datasource.url=jdbc:postgresql://localhost:5432/productdb
spring.datasource.username=product
spring.datasource.password=secret

# Let Hibernate create the schema from the Product entity on every startup.
# Similar to Mongoose deriving a collection from a schema - but create-drop means
# all data is wiped on restart, so it is only acceptable for dev/learning.
# spring.jpa.hibernate.ddl-auto=create-drop

# Temporary: Hibernate still manages the schema. Flyway takes this over in the next step.
# "update" only adds what is missing - unlike create-drop it does not wipe data on restart.
spring.jpa.hibernate.ddl-auto=validate

# Print the SQL Hibernate generates - useful for seeing what actually happens underneath
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Browser-based UI to inspect the database
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# close the Hibernate session when the transaction ends, not at the end of the request
spring.jpa.open-in-view=false

# HS256 needs at least 256 bits of key material, so 32+ characters.
# Committing a secret is only acceptable because this is a throwaway learning setup;
# in a real deployment this comes from an env var or a secret store, never from the repo.
security.jwt.secret=dev-only-secret-change-me-32-chars-min!!
security.jwt.validity-minutes=15

# Comma-separated list; a real deployment names the actual frontend origins.
# "*" is never combined with credentials - the browser rejects that combination.
security.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Expose only what is needed. Actuator can expose a lot (env, beans, heap dump) -
# never open them all, they are an information leak.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# 1.0 = trace every request. A real deployment sizes this down (e.g. 0.1) - full tracing
# is real overhead per request plus real storage cost; a lower rate can miss rare failures.
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans