# Local Postgres for product-service.
#
#   docker compose up -d      start it in the background
#   docker compose ps         see whether it is healthy
#   docker compose logs -f    follow the logs
#   docker compose down       stop it (data survives, it lives in the named volume)
#   docker compose down -v    stop it AND delete the data volume (full reset)

services:
  app:
    build: .
    container_name: product-app
    depends_on:
      postgres:
        condition: service_healthy   # uses the healthcheck we wrote on day one
    environment:
      # Env vars override application.properties (relaxed binding:
      # SPRING_DATASOURCE_URL -> spring.datasource.url). This is how secrets
      # and per-environment settings arrive without touching the repo.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/productdb
      SPRING_DATASOURCE_USERNAME: product
      SPRING_DATASOURCE_PASSWORD: secret
      SECURITY_JWT_SECRET: dev-only-secret-change-me-32-chars-min!!
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
  postgres:
    image: postgres:18-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: product
      POSTGRES_PASSWORD: secret   # local only - real environments read this from a secret store
    ports:
      - "5432:5432"               # host:container - the app connects to localhost:5432
    volumes:
      # Named volume: data survives container restarts.
      # Postgres 18 moved its data directory to a version-specific path
      # (/var/lib/postgresql/18/docker), so we mount the PARENT directory.
      # Mounting /var/lib/postgresql/data - the pre-18 convention - would silently
      # leave the real data outside the volume.
      - product-pgdata:/var/lib/postgresql
    healthcheck:
      # "the container is running" does not mean "Postgres accepts connections" yet;
      # pg_isready is what makes the difference visible in `docker compose ps`
      test: ["CMD-SHELL", "pg_isready -U product -d productdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  product-pgdata:
