spring.application.name=order-service

# 8081: product-service already owns 8080
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=product
spring.datasource.password=secret

# Flyway owns the schema here too; Hibernate only verifies
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Same secret as product-service - this is the symmetric-key problem we will discuss:
# to VERIFY tokens this service also gains the ability to ISSUE them.
security.jwt.secret=dev-only-secret-change-me-32-chars-min!!

# Where product-service lives. In compose this becomes http://app:8080
product-service.base-url=http://localhost:8080

management.endpoints.web.exposure.include=health,info

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Off by default - opts the RabbitTemplate into carrying the current trace context
# into the message it publishes, so the notification-service span joins the same trace.
spring.rabbitmq.template.observation-enabled=true