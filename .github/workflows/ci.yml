name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Run one job per service. fail-fast: false so a failure in one service does not
      # cancel the other - you want both results, not the first bad news.
      fail-fast: false
      matrix:
        service: [product-service, order-service, notification-service]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven # keeps ~/.m2 between runs, so dependencies are not re-downloaded

      # Testcontainers starts a real Postgres during the integration test.
      # No extra setup needed: GitHub-hosted runners already have Docker.
      - name: Build and test
        run: ./mvnw -B clean verify

      # Proves the image still builds - a broken Dockerfile should fail CI, not deploy day.
      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:ci .
