worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limiting zone: keyed by client IP, 10 req/s steady rate, tracked in a 10MB
    # shared-memory zone (enough for roughly 160k tracked IPs). This is the same job Faz 4's
    # in-app LoginAttemptService did, moved to the layer that survives instance restarts and
    # applies across every replica - the "wrong layer" note from that phase, corrected here.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # nginx's default for a throttled request is 503 (Service Unavailable) - override to the
    # more specific 429 (Too Many Requests) so a client can tell "you're overloaded" apart
    # from "slow down, you're rate limited".
    limit_req_status 429;

    server {
        listen 8090;

        # nginx's own response, never reaches a backend - used for the compose healthcheck.
        location /healthz {
            return 200 "OK\n";
        }

        # burst=5: absorb a short spike of up to 5 requests above the steady rate before
        # rejecting anything. nodelay: serve burst requests immediately instead of queuing
        # them to enforce the rate - a real user's page load fires several requests at once.
        # No trailing slash: a location with a trailing slash only matches paths
        # UNDERNEATH it, not the exact path itself. "/api/products" (the collection
        # endpoint, no id) needs to match too, so the prefix is written bare.
        location /api/products {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://product:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Authorization is forwarded automatically - proxy_pass does not strip it.
        }

        location /api/orders {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://order:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
